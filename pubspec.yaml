name: arise_application
description: "Application for Real-time Information and Safety on Evacuation"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  meta: ^1.19.0
  path_provider: ^2.1.6
  rename_app: ^1.6.6
  supabase_flutter: ^2.17.2
  timeago: ^3.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/icons/icon_white.png
    - assets/logo.png
    - assets/ACAD2101.glb
    - assets/Duck.glb
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400

flutter_native_splash:
  android: true
  ios: false
  web: false

  color: "#ffffff"
  image: assets/icons/icon.png

  color_dark: "#000000"
  image_dark: assets/icons/icon_white.png

  android_12:
    color: "#ffffff"
    image: assets/icons/icon.png
    color_dark: "#000000"
    image_dark: assets/icons/icon_white.png