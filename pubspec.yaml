name: arise_application
description: "Application for Real-time Information and Safety on Evacuation"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  ar_flutter_plugin_plus: ^1.1.3
  bloc: ^9.2.1
  camera: ^0.11.4
  connectivity_plus: ^7.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  meta: ^1.19.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  rename_app: ^1.6.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sidebarx: ^0.17.2
  supabase_flutter: ^2.17.2
  timeago: ^3.7.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  vector_math: ^2.4.3
  archive: 4.0.7
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^23.0.1
  audioplayers: ^6.8.1
  flutter_volume_controller: ^2.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/icons/icon_white.png
    - assets/logo.png
    - assets/images/triangle.png
    - assets/models/
    - assets/sounds/
    - assets/sounds/siren.wav
    - assets/images/contact_logos/
    - assets/images/
    
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
