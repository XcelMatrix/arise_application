name: arise_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  ar_flutter_plugin_plus: ^1.1.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  rename_app: ^1.6.6
  supabase_flutter: ^2.17.2
  timeago: ^3.7.1
  vector_math: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/icons/icon_white.png
    - assets/logo.png
    - assets/models/ACAD2306.gltf
    - assets/images/triangle.png
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
